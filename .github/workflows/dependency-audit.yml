name: Dependency Audit

on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tree-audit:
    name: Full-tree npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full-tree audit
        id: audit
        continue-on-error: true
        run: npm audit --json > npm-audit-full.json

      - name: Upload audit artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          if-no-files-found: error

      - name: Warn on audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "npm audit reported dependency advisories."
          echo "Review the uploaded npm-audit-full artifact and remediate or document exceptions."

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist
          key: ${{ runner.os }}-release-build-${{ hashFiles('package-lock.json', 'tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-release-build-

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build
        run: npm run build

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/
          cp README.md release/
          cp LICENSE release/
          tar -czf discord-bot-${{ steps.version.outputs.version }}.tar.gz -C release .
          zip -r discord-bot-${{ steps.version.outputs.version }}.zip release/

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            discord-bot-${{ steps.version.outputs.version }}.tar.gz
            discord-bot-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

